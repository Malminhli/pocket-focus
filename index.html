<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pocket Focus — مؤقت تركيز بسيط وأنيق يعمل بالكامل في المتصفح." />
  <title>Pocket Focus — مؤقت تركيز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>Pocket Focus</span></div>
      <button id="languageButton" class="ghost-button" type="button" aria-label="Change language">EN</button>
    </header>

    <section class="hero">
      <p class="eyebrow" data-i18n="eyebrow">مساحتك الصغيرة للإنجاز</p>
      <h1 data-i18n="title">ركّز على شيء واحد.</h1>
      <p class="subtitle" data-i18n="subtitle">جلسات قصيرة، تقدّم واضح، وضوضاء أقل.</p>
    </section>

    <section class="timer-card" aria-label="Focus timer">
      <div class="mode-tabs" role="tablist">
        <button class="mode active" data-mode="focus" data-i18n="focus">تركيز</button>
        <button class="mode" data-mode="short" data-i18n="shortBreak">استراحة قصيرة</button>
        <button class="mode" data-mode="long" data-i18n="longBreak">استراحة طويلة</button>
      </div>
      <div id="time" class="time" aria-live="polite">25:00</div>
      <p id="status" class="status" data-i18n="ready">جاهز لجلسة تركيز جديدة؟</p>
      <div class="timer-actions">
        <button id="startButton" class="primary-button" type="button" data-i18n="start">ابدأ</button>
        <button id="resetButton" class="secondary-button" type="button" data-i18n="reset">إعادة ضبط</button>
      </div>
      <div class="session-dots" aria-label="Completed sessions"><span></span><span></span><span></span><span></span></div>
      <p class="session-count"><strong id="count">0</strong> <span data-i18n="sessionsToday">جلسات اليوم</span></p>
    </section>

    <section class="tip-card">
      <span class="tip-icon">☼</span>
      <div><strong data-i18n="tipTitle">قاعدة اليوم</strong><p data-i18n="tip">أغلق التبويبات التي لا تحتاجها قبل أن تبدأ.</p></div>
    </section>
    <footer><span>Made for one good thing at a time.</span><span>© 2026 Pocket Focus</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
